<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWKINS LAB - SECURE COMMS</title>
    <style>
        /* Base CRT & Terminal Vibe */
        body { 
            background-color: #050505; 
            color: #4af626; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Main Container */
        .card { 
            background: #000; 
            width: 100%;
            max-width: 700px; 
            padding: 30px; 
            border: 2px solid #4af626; 
            box-shadow: 0 0 15px rgba(74, 246, 38, 0.4), inset 0 0 15px rgba(74, 246, 38, 0.2);
            position: relative;
            z-index: 10;
        }

        h2 { 
            margin-top: 0; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #4af626;
            border-bottom: 2px dashed #4af626;
            padding-bottom: 10px;
        }
        
        /* Links and Statuses */
        #share-link-box { 
            padding: 15px; 
            background: #052005; 
            margin-bottom: 20px; 
            border: 1px solid #4af626; 
        }
        #share-link-box p { color: #4af626; font-size: 14px; text-transform: uppercase; }
        #share-link { 
            font-size: 18px; 
            color: #fff; 
            text-shadow: 0 0 8px #fff; 
            font-weight: bold; 
            text-decoration: none; 
            word-break: break-all;
        }
        
        #status-box { 
            padding: 15px; 
            background: #000; 
            border: 1px solid #4af626;
            margin-bottom: 20px; 
            font-weight: bold; 
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Chat UI */
        #chatInterface { display: none; text-align: left; }
        #chatBox { 
            height: 350px; 
            border: 1px solid #4af626; 
            overflow-y: auto; 
            padding: 15px; 
            background: #000; 
            margin-bottom: 15px; 
            box-shadow: inset 0 0 10px rgba(74, 246, 38, 0.2);
        }
        
        .message { margin: 10px 0; padding: 10px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .me { border: 1px solid #4af626; background: #052005; color: #4af626; margin-left: auto; }
        .them { border: 1px dashed #4af626; background: #000; color: #4af626; }
        
        /* Inputs and Buttons */
        .chat-input-area { display: flex; gap: 10px; align-items: stretch; }
        input[type="text"] { 
            flex-grow: 1; 
            padding: 10px; 
            background: #000;
            border: 1px solid #4af626; 
            color: #4af626;
            font-family: 'Courier New', Courier, monospace;
        }
        input[type="text"]:focus { outline: none; box-shadow: 0 0 8px rgba(74, 246, 38, 0.5); }
        
        .btn-action { 
            background: #000; 
            color: #4af626; 
            border: 1px solid #4af626; 
            padding: 10px 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-action:hover { background: #4af626; color: #000; }
        
        /* Shared Files & Images */
        img.chat-img { 
            max-width: 100%; 
            border: 1px solid #4af626; 
            margin-top: 10px; 
            display: block; 
            filter: sepia(100%) hue-rotate(70deg) saturate(200%); /* Green terminal tint for images */
        }
        a { color: #4af626; text-decoration: none; }
        a:hover { text-decoration: underline; text-shadow: 0 0 5px #4af626; }

        /* Custom Scrollbar for Terminal look */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid #4af626; }
        ::-webkit-scrollbar-thumb { background: #4af626; }
    </style>
</head>
<body>

<div class="card">
    <h2>Secure Comms (Local)</h2>
    <div id="share-link-box">
        <p>Awaiting secondary terminal connection at address:</p>
        <a id="share-link" href="#" target="_blank">Initializing...</a>
    </div>
    <div id="status-box">Scanning local network for peers...</div>

    <div id="chatInterface">
        <div id="chatBox"></div>
        <div class="chat-input-area">
            <button class="btn-action" id="btnFile">FILE</button>
            <input type="file" id="chatFileIn" style="display:none">
            <input type="text" id="msgInput" placeholder="ENTER TRANSMISSION...">
            <button class="btn-action" id="btnSend">TX</button>
        </div>
    </div>
</div>

<script>
    const setStatus = (txt) => document.getElementById('status-box').innerText = txt;
    const addMsg = (cls, txt) => {
        const b = document.getElementById('chatBox');
        b.innerHTML += `<div class="message ${cls}">${txt}</div>`;
        b.scrollTop = b.scrollHeight;
    };

    // 1. WebRTC & WebSocket Setup
    const pc = new RTCPeerConnection({ iceServers: [] });
    let dataChannel;
    let fileBuffer = [];
    let currentFileName = "";
    let pendingCandidates = []; // Queue for early ICE candidates

    fetch('/get-ip')
        .then(response => response.json())
        .then(data => {
            const url = `http://${data.ip}:${data.port}`;
            const linkEl = document.getElementById('share-link');
            linkEl.href = url;
            linkEl.innerText = url;
        })
        .catch(err => {
            document.getElementById('share-link').innerText = "NETWORK ERROR: IP UNKNOWN";
        });

    // Connect to the FastAPI WebSocket server
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    const ws = new WebSocket(wsUrl);

    // 2. Automatic Signaling Logic with Race-Condition Fix
    ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        // A new peer joined! Host creates the Offer.
        if (msg.type === 'peer_joined') {
            setStatus("Peer detected. Handshaking...");
            dataChannel = pc.createDataChannel("quickshare");
            setupDataChannel(dataChannel);
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
        }
        
        // Peer receives Offer
        else if (msg.type === 'offer') {
            setStatus("Accepting secure connection...");
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));

            // Process any candidates that arrived too early
            pendingCandidates.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
            pendingCandidates = [];
        }
        
        // Host receives Answer
        else if (msg.type === 'answer') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            
            // Process any candidates that arrived too early
            pendingCandidates.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
            pendingCandidates = [];
        }
        
        // Receive ICE network path
        else if (msg.type === 'candidate') {
            // Only add the candidate if the remote description is ready. Otherwise, queue it.
            if (pc.remoteDescription && pc.remoteDescription.type) {
                await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } else {
                pendingCandidates.push(msg.candidate);
            }
        }
    };

    // Send ICE candidates to the other peer as we find them
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
    };

    // If we are the one receiving the connection, grab the data channel
    pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannel(dataChannel);
    };

    // 3. File & Chat UI Logic
    function setupDataChannel(channel) {
        channel.onopen = () => {
            document.getElementById('status-box').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
        };

        channel.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'f-start') {
                    fileBuffer = [];
                    currentFileName = msg.name;
                    addMsg('them', `<i>DOWNLOADING: ${msg.name}...</i>`);
                } else if (msg.type === 'f-chunk') {
                    fileBuffer.push(msg.data);
                } else if (msg.type === 'f-end') {
                    const fullData = fileBuffer.join('');
                    if (fullData.startsWith('data:image')) {
                        addMsg('them', `<b>${currentFileName}</b><img src="${fullData}" class="chat-img">`);
                    } else {
                        addMsg('them', `<a href="${fullData}" download="${currentFileName}" style="font-weight:bold;">[ SAVE ] ${currentFileName}</a>`);
                    }
                } else { addMsg('them', e.data); }
            } catch (err) { addMsg('them', e.data); }
        };
    }

    document.getElementById('btnSend').onclick = () => {
        const i = document.getElementById('msgInput');
        if (i.value && dataChannel && dataChannel.readyState === "open") {
            dataChannel.send(i.value);
            addMsg('me', i.value);
            i.value = "";
        }
    };

    document.getElementById('btnFile').onclick = () => document.getElementById('chatFileIn').click();
    document.getElementById('chatFileIn').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !dataChannel || dataChannel.readyState !== "open") return;
        
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const data = ev.target.result;
            const size = 16384; 
            dataChannel.send(JSON.stringify({ type: 'f-start', name: file.name }));
            for (let i = 0; i < data.length; i += size) {
                dataChannel.send(JSON.stringify({ type: 'f-chunk', data: data.slice(i, i + size) }));
                if (dataChannel.bufferedAmount > 1000000) await new Promise(r => setTimeout(r, 60));
            }
            dataChannel.send(JSON.stringify({ type: 'f-end' }));
            
            if (data.startsWith('data:image')) { addMsg('me', `<b>${file.name}</b><img src="${data}" class="chat-img">`); } 
            else { addMsg('me', `UPLOADED: ${file.name}`); }
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
