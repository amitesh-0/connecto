<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Share (Local Server)</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        
        #status-box { padding: 15px; background: #eef2f5; border-radius: 10px; margin-bottom: 20px; font-weight: bold; color: #007bff; }
        
        /* Chat UI */
        #chatInterface { display: none; text-align: left; }
        #chatBox { height: 350px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; background: #fff; border-radius: 8px; margin-bottom: 10px; }
        .message { margin: 8px 0; padding: 10px; border-radius: 10px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .me { background: #007bff; color: white; margin-left: auto; }
        .them { background: #e9e9eb; color: #333; }
        .chat-input-area { display: flex; gap: 5px; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-action { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        img.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>Quick Share (Local Hotspot)</h2>
    <div id="status-box">Waiting for another laptop to join...</div>

    <div id="chatInterface">
        <div id="chatBox"></div>
        <div class="chat-input-area">
            <button class="btn-action" id="btnFile" style="background:#6c757d;">📎</button>
            <input type="file" id="chatFileIn" style="display:none">
            <input type="text" id="msgInput" placeholder="Message...">
            <button class="btn-action" id="btnSend">Send</button>
        </div>
    </div>
</div>

<script>
    const setStatus = (txt) => document.getElementById('status-box').innerText = txt;
    const addMsg = (cls, txt) => {
        const b = document.getElementById('chatBox');
        b.innerHTML += `<div class="message ${cls}">${txt}</div>`;
        b.scrollTop = b.scrollHeight;
    };

    // 1. WebRTC & WebSocket Setup
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    let dataChannel;
    let fileBuffer = [];
    let currentFileName = "";

    // Connect to the FastAPI WebSocket server automatically
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;
    const ws = new WebSocket(wsUrl);

    // 2. Automatic Signaling Logic (No copy/pasting)
    ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        // A new peer joined! If we are the host, we create the Offer automatically.
        if (msg.type === 'peer_joined') {
            setStatus("Peer found! Establishing direct connection...");
            dataChannel = pc.createDataChannel("quickshare");
            setupDataChannel(dataChannel);
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
        }
        
        // We received an Offer. We must Answer.
        else if (msg.type === 'offer') {
            setStatus("Accepting connection...");
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
        }
        
        // We received an Answer. Connection complete.
        else if (msg.type === 'answer') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        }
        
        // We received an ICE network path. Add it.
        else if (msg.type === 'candidate') {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
        }
    };

    // Send ICE candidates to the other peer as we find them
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
    };

    // If we are the one receiving the connection, grab the data channel
    pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannel(dataChannel);
    };

    // 3. File & Chat UI Logic
    function setupDataChannel(channel) {
        channel.onopen = () => {
            document.getElementById('status-box').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
        };

        channel.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'f-start') {
                    fileBuffer = [];
                    currentFileName = msg.name;
                    addMsg('them', `<i>Receiving ${msg.name}...</i>`);
                } else if (msg.type === 'f-chunk') {
                    fileBuffer.push(msg.data);
                } else if (msg.type === 'f-end') {
                    const fullData = fileBuffer.join('');
                    if (fullData.startsWith('data:image')) {
                        addMsg('them', `<b>${currentFileName}</b><img src="${fullData}" class="chat-img">`);
                    } else {
                        addMsg('them', `<a href="${fullData}" download="${currentFileName}" style="font-weight:bold;">💾 Download ${currentFileName}</a>`);
                    }
                } else { addMsg('them', e.data); }
            } catch (err) { addMsg('them', e.data); }
        };
    }

    document.getElementById('btnSend').onclick = () => {
        const i = document.getElementById('msgInput');
        if (i.value && dataChannel && dataChannel.readyState === "open") {
            dataChannel.send(i.value);
            addMsg('me', i.value);
            i.value = "";
        }
    };

    document.getElementById('btnFile').onclick = () => document.getElementById('chatFileIn').click();
    document.getElementById('chatFileIn').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !dataChannel || dataChannel.readyState !== "open") return;
        
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const data = ev.target.result;
            const size = 16384; 
            dataChannel.send(JSON.stringify({ type: 'f-start', name: file.name }));
            for (let i = 0; i < data.length; i += size) {
                dataChannel.send(JSON.stringify({ type: 'f-chunk', data: data.slice(i, i + size) }));
                if (dataChannel.bufferedAmount > 1000000) await new Promise(r => setTimeout(r, 60));
            }
            dataChannel.send(JSON.stringify({ type: 'f-end' }));
            
            if (data.startsWith('data:image')) { addMsg('me', `<b>${file.name}</b><img src="${data}" class="chat-img">`); } 
            else { addMsg('me', `Sent: ${file.name}`); }
        };
        reader.readAsDataURL(file);
    };
</script>
</body>
</html>
