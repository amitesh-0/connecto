<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWKINS LAB - SECURE COMMS</title>
    <style>
        /* Base CRT & Terminal Vibe */
        body { 
            background-color: #050505; 
            color: #4af626; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }

        .card { 
            background: #000; 
            width: 100%;
            max-width: 700px; 
            padding: 30px; 
            border: 2px solid #4af626; 
            box-shadow: 0 0 15px rgba(74, 246, 38, 0.4), inset 0 0 15px rgba(74, 246, 38, 0.2);
            position: relative;
            z-index: 10;
        }

        h2 { 
            margin-top: 0; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #4af626;
            border-bottom: 2px dashed #4af626;
            padding-bottom: 10px;
        }
        
        #share-link-box { padding: 15px; background: #052005; margin-bottom: 20px; border: 1px solid #4af626; }
        #share-link-box p { color: #4af626; font-size: 14px; text-transform: uppercase; }
        #share-link { font-size: 18px; color: #fff; text-shadow: 0 0 8px #fff; font-weight: bold; text-decoration: none; word-break: break-all; }
        
        #status-box { 
            padding: 15px; background: #000; border: 1px solid #4af626; margin-bottom: 20px; 
            font-weight: bold; text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #auth-box {
            display: none; padding: 15px; background: #050505; border: 1px dashed #ff3333; 
            margin-bottom: 20px; text-align: center; box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);
        }
        #auth-box p { color: #ff3333; font-weight: bold; letter-spacing: 1px; margin-top: 0; }
        
        .btn-auth, .btn-accept-file {
            background: #000; padding: 10px 20px; cursor: pointer; font-weight: bold; 
            font-family: 'Courier New', Courier, monospace; text-transform: uppercase; transition: all 0.2s;
        }
        #btnAccept, .btn-accept-file { border: 1px solid #4af626; color: #4af626; margin-top: 10px; }
        #btnAccept:hover, .btn-accept-file:hover { background: #4af626; color: #000; }
        #btnDeny { border: 1px solid #ff3333; color: #ff3333; margin: 0 5px; }
        #btnDeny:hover { background: #ff3333; color: #000; }
        
        #chatInterface { display: none; text-align: left; }
        #chatBox { 
            height: 350px; border: 1px solid #4af626; overflow-y: auto; padding: 15px; 
            background: #000; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(74, 246, 38, 0.2);
        }
        
        .message { margin: 10px 0; padding: 10px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .me { border: 1px solid #4af626; background: #052005; color: #4af626; margin-left: auto; }
        .them { border: 1px dashed #4af626; background: #000; color: #4af626; }
        .progress-text { font-weight: bold; color: #fff; text-shadow: 0 0 5px #fff; }
        
        .chat-input-area { display: flex; gap: 10px; align-items: stretch; }
        input[type="text"] { 
            flex-grow: 1; padding: 10px; background: #000; border: 1px solid #4af626; 
            color: #4af626; font-family: 'Courier New', Courier, monospace;
        }
        input[type="text"]:focus { outline: none; box-shadow: 0 0 8px rgba(74, 246, 38, 0.5); }
        
        .btn-action { 
            background: #000; color: #4af626; border: 1px solid #4af626; padding: 10px 20px; 
            cursor: pointer; font-weight: bold; font-family: 'Courier New', Courier, monospace; text-transform: uppercase; transition: all 0.2s;
        }
        .btn-action:hover { background: #4af626; color: #000; }
        
        img.chat-img { max-width: 100%; border: 1px solid #4af626; margin-top: 10px; display: block; filter: sepia(100%) hue-rotate(70deg) saturate(200%); }
        a { color: #4af626; text-decoration: none; }
        a:hover { text-decoration: underline; text-shadow: 0 0 5px #4af626; }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid #4af626; }
        ::-webkit-scrollbar-thumb { background: #4af626; }
    </style>
</head>
<body>

<div class="card">
    <h2>Secure Comms (Local)</h2>
    <div id="share-link-box">
        <p>Awaiting secondary terminal connection at address:</p>
        <a id="share-link" href="#" target="_blank">Initializing...</a>
    </div>
    
    <div id="status-box">Scanning local network for peers...</div>

    <div id="auth-box">
        <p>WARNING: INCOMING CONNECTION REQUEST DETECTED</p>
        <button class="btn-auth" id="btnAccept">AUTHORIZE</button>
        <button class="btn-auth" id="btnDeny">DENY</button>
    </div>

    <div id="chatInterface">
        <div id="chatBox"></div>
        <div class="chat-input-area">
            <button class="btn-action" id="btnFile">FILE</button>
            <input type="file" id="chatFileIn" style="display:none">
            <input type="text" id="msgInput" placeholder="ENTER TRANSMISSION...">
            <button class="btn-action" id="btnSend">TX</button>
        </div>
    </div>
</div>

<script>
    const setStatus = (txt) => document.getElementById('status-box').innerText = txt;
    const addMsg = (cls, txt, id = null) => {
        const b = document.getElementById('chatBox');
        const idAttr = id ? `id="${id}"` : "";
        b.innerHTML += `<div class="message ${cls}" ${idAttr}>${txt}</div>`;
        b.scrollTop = b.scrollHeight;
    };

    const pc = new RTCPeerConnection({ iceServers: [] });
    let dataChannel;
    
    // Sender Variables
    let pendingUploads = {}; 
    
    // Receiver Variables
    let incomingFileInfo = null;
    let currentDlMsgId = "";
    let receivedBytes = 0;
    
    // Disk Stream vs RAM Variables
    let useDiskStream = false;
    let activeStream = null;
    let writeQueue = Promise.resolve(); // Prevents overlapping writes to the hard drive
    let receiveBuffer = []; // Fallback for RAM
    
    let pendingCandidates = []; 

    fetch('/get-ip').then(r => r.json()).then(data => {
        const url = `http://${data.ip}:${data.port}`;
        const linkEl = document.getElementById('share-link');
        linkEl.href = url; linkEl.innerText = url;
    }).catch(err => {
        document.getElementById('share-link').innerText = "NETWORK ERROR: IP UNKNOWN";
    });

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

    document.getElementById('btnAccept').onclick = async () => {
        document.getElementById('auth-box').style.display = 'none';
        setStatus("Authorization granted. Handshaking...");
        dataChannel = pc.createDataChannel("quickshare");
        setupDataChannel(dataChannel);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
    };

    document.getElementById('btnDeny').onclick = () => {
        document.getElementById('auth-box').style.display = 'none';
        setStatus("Connection denied. Monitoring for new peers...");
        ws.send(JSON.stringify({ type: 'connection_denied' }));
    };

    ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'peer_joined') {
            setStatus("Incoming connection detected. Awaiting authorization...");
            document.getElementById('auth-box').style.display = 'block';
        } else if (msg.type === 'connection_denied') {
            setStatus("ACCESS DENIED BY HOST.");
            document.getElementById('status-box').style.color = "#ff3333";
            pc.close(); ws.close();
        } else if (msg.type === 'offer') {
            setStatus("Accepting secure connection...");
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
            pendingCandidates.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
            pendingCandidates = [];
        } else if (msg.type === 'answer') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            pendingCandidates.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
            pendingCandidates = [];
        } else if (msg.type === 'candidate') {
            if (pc.remoteDescription && pc.remoteDescription.type) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            else pendingCandidates.push(msg.candidate);
        }
    };

    pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate })); };
    pc.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannel(dataChannel); };

    // --- RECEIVER: Handling incoming requests and approving streams ---
    window.acceptFile = async (fileId, fileName) => {
        const msgBlock = document.getElementById(fileId);
        
        try {
            // Attempt to open a secure direct-to-disk stream
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({ suggestedName: fileName });
                activeStream = await handle.createWritable();
                useDiskStream = true;
                msgBlock.innerHTML = `<i>DOWNLOADING DIRECT TO DISK: ${fileName}... <span class="progress-text" id="${fileId}-pct">0%</span></i>`;
            } else {
                // Fallback to RAM buffer if HTTP restricts the File System API
                useDiskStream = false;
                receiveBuffer = [];
                msgBlock.innerHTML = `<i>DOWNLOADING TO RAM (HTTP Fallback): ${fileName}... <span class="progress-text" id="${fileId}-pct">0%</span></i><br><small style="color:yellow">Warning: Very large files may crash the tab due to HTTP security limits.</small>`;
            }

            currentDlMsgId = fileId;
            receivedBytes = 0;
            
            // Tell sender we are ready to receive data
            dataChannel.send(JSON.stringify({ type: 'f-approved', id: fileId }));
        } catch (err) {
            msgBlock.innerHTML = `<span style="color:#ff3333">FILE TRANSFER ABORTED BY USER.</span>`;
        }
    };

    function setupDataChannel(channel) {
        channel.binaryType = 'arraybuffer';

        channel.onopen = () => {
            document.getElementById('status-box').style.display = 'none';
            document.getElementById('share-link-box').style.display = 'none'; 
            document.getElementById('chatInterface').style.display = 'block';
        };

        channel.onmessage = async (e) => {
            if (typeof e.data === 'string') {
                try {
                    const msg = JSON.parse(e.data);
                    
                    // 1. RECEIVER gets a request
                    if (msg.type === 'f-request') {
                        incomingFileInfo = msg;
                        addMsg('them', `<b>INCOMING FILE:</b> ${msg.name} (${(msg.size / 1024 / 1024).toFixed(2)} MB)<br><button class="btn-accept-file" onclick="acceptFile('${msg.id}', '${msg.name}')">ACCEPT STREAM</button>`, msg.id);
                    } 
                    
                    // 2. SENDER gets approval, starts sending chunks
                    else if (msg.type === 'f-approved') {
                        startUploading(msg.id);
                    }
                    
                    // 3. RECEIVER gets EOF signal, closes stream
                    else if (msg.type === 'f-end') {
                        const dlContainer = document.getElementById(currentDlMsgId);
                        
                        // --- INTEGRITY CHECK ---
                        if (receivedBytes !== incomingFileInfo.size) {
                            // CORRUPTION / DROPPED PACKETS DETECTED
                            if (useDiskStream) {
                                await writeQueue; 
                                await activeStream.close();
                                activeStream = null;
                            }
                            if (dlContainer) {
                                dlContainer.innerHTML = `<span style="color:#ff3333; font-weight:bold;">[ ERROR: TRANSFER INCOMPLETE ]<br>Expected: ${incomingFileInfo.size} bytes<br>Received: ${receivedBytes} bytes<br>File corrupted. Please try again.</span>`;
                            }
                        } else {
                            // SUCCESS
                            if (useDiskStream) {
                                // Wait for any remaining chunks to write, then close the disk stream safely
                                await writeQueue; 
                                await activeStream.close();
                                activeStream = null;
                                if (dlContainer) dlContainer.innerHTML = `<span style="color:#4af626; font-weight:bold;">[ SECURE FILE SAVED TO DISK ]: ${incomingFileInfo.name} <br>INTEGRITY: SIZE VERIFIED (${incomingFileInfo.size} bytes)</span>`;
                            } else {
                                // RAM Fallback: stitch the blobs and generate download link
                                const blob = new Blob(receiveBuffer, { type: incomingFileInfo.fileType });
                                const url = URL.createObjectURL(blob); 
                                if (dlContainer) dlContainer.innerHTML = `<a href="${url}" download="${incomingFileInfo.name}" style="font-weight:bold;">[ CLICK TO SAVE FROM RAM ] ${incomingFileInfo.name} <br>INTEGRITY: SIZE VERIFIED (${incomingFileInfo.size} bytes)</a>`;
                            }
                        }
                        
                        incomingFileInfo = null;
                    } 
                    else { addMsg('them', e.data); }
                } catch (err) { addMsg('them', e.data); }
            } 
            
            // RECEIVER catching binary data
            else if (e.data instanceof ArrayBuffer) {
                receivedBytes += e.data.byteLength;
                
                // Update percentage
                if (incomingFileInfo && incomingFileInfo.size > 0) {
                    let pct = Math.floor((receivedBytes / incomingFileInfo.size) * 100);
                    const pctEl = document.getElementById(`${currentDlMsgId}-pct`);
                    if (pctEl) pctEl.innerText = `${pct > 100 ? 100 : pct}%`;
                }

                if (useDiskStream) {
                    // Queue the hard drive write so they execute strictly in order
                    writeQueue = writeQueue.then(() => activeStream.write(e.data));
                } else {
                    // RAM Fallback
                    receiveBuffer.push(e.data);
                }
            }
        };
    }

    document.getElementById('btnSend').onclick = () => {
        const i = document.getElementById('msgInput');
        if (i.value && dataChannel && dataChannel.readyState === "open") {
            dataChannel.send(i.value);
            addMsg('me', i.value);
            i.value = "";
        }
    };

    // --- SENDER: Selecting a file and requesting permission ---
    document.getElementById('btnFile').onclick = () => document.getElementById('chatFileIn').click();
    
    document.getElementById('chatFileIn').onchange = (e) => {
        const file = e.target.files[0];
        if (!file || !dataChannel || dataChannel.readyState !== "open") return;
        
        const fileId = "file-" + Date.now();
        pendingUploads[fileId] = file;

        // Send metadata request to receiver
        dataChannel.send(JSON.stringify({ 
            type: 'f-request', 
            id: fileId,
            name: file.name, 
            size: file.size, 
            fileType: file.type 
        }));

        addMsg('me', `<i>REQUESTING TRANSFER: ${file.name}... (Awaiting Peer Approval)</i>`, fileId);
    };

    // --- SENDER: Actively chunking and streaming data after approval ---
    async function startUploading(fileId) {
        const file = pendingUploads[fileId];
        if (!file) return;

        const ulContainer = document.getElementById(fileId);
        if (ulContainer) ulContainer.innerHTML = `<i>UPLOADING: ${file.name}... <span class="progress-text" id="${fileId}-pct">0%</span></i>`;

        const chunkSize = 65536; // Increased to 64KB for faster binary streams
        let offset = 0;

        while (offset < file.size) {
            const slice = file.slice(offset, offset + chunkSize);
            const buffer = await slice.arrayBuffer(); 
            
            while (dataChannel.bufferedAmount > 2 * 1024 * 1024) { 
                await new Promise(r => setTimeout(r, 50)); 
            }

            dataChannel.send(buffer);
            offset += buffer.byteLength;

            let pct = Math.floor((offset / file.size) * 100);
            const pctEl = document.getElementById(`${fileId}-pct`);
            if (pctEl) pctEl.innerText = `${pct > 100 ? 100 : pct}%`;
        }
        
        dataChannel.send(JSON.stringify({ type: 'f-end' }));

        if (ulContainer) ulContainer.innerHTML = `UPLOAD COMPLETE: ${file.name} (100%)`;
        delete pendingUploads[fileId]; // Clean up sender memory
    }
</script>
</body>
</html>
